name: Build and Deploy

# On a v* tag: run the check workflow, build the site, bake it into an nginx
# image and push it to ghcr.io/<owner>/<repo>, then record the digest in
# gtfs-zone-infra, which ArgoCD rolls out.
#
# Requires:
#   Variables:
#     VITE_CORS_PROXY - CORS proxy prefix (optional)
#   Secrets:
#     INFRA_DEPLOY_KEY - private half of a write deploy key on gtfs-zone-infra

on:
  push:
    tags:
      - 'v*'

env:
  SITE_DIR: sites

jobs:
  check:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  build:
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Full history so the build can read the version from the tag.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Version comes from packageManager in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install node modules
        run: pnpm install --frozen-lockfile

      # Unset falls back to web-common's default proxy.
      - name: Build
        run: pnpm build
        env:
          VITE_CORS_PROXY: ${{ vars.VITE_CORS_PROXY }}

      # Precompressed siblings for nginx's gzip_static.
      - name: Precompress assets
        run: |
          find dist -type f \
            \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.svg' \) \
            -size +1k -exec gzip -9 -k -f {} +

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Load infra deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.INFRA_DEPLOY_KEY }}

      - name: Record digest in gtfs-zone-infra
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git clone --depth 1 git@github.com:gtfs-zone/gtfs-zone-infra.git /tmp/infra
          cd "/tmp/infra/${SITE_DIR}"
          kustomize edit set image "${IMAGE}=${IMAGE}@${DIGEST}"
          cd /tmp/infra
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${SITE_DIR}/kustomization.yaml"
          git commit -m "deploy(manage.rt.gtfs.zone): rt-manager ${GITHUB_REF_NAME}"
          # Concurrent site releases race on the same file; rebase and retry rather
          # than failing the release.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
